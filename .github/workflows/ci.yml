name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      USE_FIREBASE_EMULATORS: "1"
      FIREBASE_PROJECT_ID: demo-dinexes
      GCLOUD_PROJECT: demo-dinexes
      FIREBASE_STORAGE_BUCKET: demo-dinexes.appspot.com
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      PLATFORM_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Type check and production build
        run: npm run build

      - name: Install Firebase emulators and browser
        run: |
          npm install -g firebase-tools@14 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start emulators and app
        run: |
          firebase emulators:start --only auth,firestore,storage --project demo-dinexes > emulators.log 2>&1 &
          for i in $(seq 1 90); do
            curl -s -o /dev/null 127.0.0.1:8080 && curl -s -o /dev/null 127.0.0.1:9099 && curl -s -o /dev/null 127.0.0.1:9199 && break
            sleep 2
          done
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > server.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done
          curl -s -o /dev/null -w "app: %{http_code}\n" http://127.0.0.1:3000/

      - name: End-to-end tests (full restaurant flow)
        run: npx playwright test

      - name: Logs
        if: always()
        run: |
          echo "----- server -----"; tail -n 200 server.log || true
          echo "----- emulators -----"; tail -n 80 emulators.log || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
